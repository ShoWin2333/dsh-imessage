name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Pack and publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm run check

      - name: Verify tag matches package version
        id: version
        shell: bash
        run: |
          version="$(node --print "require('./package.json').version")"
          expected_tag="v${version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if [[ "${version}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Pack installable plugin
        id: pack
        shell: bash
        run: |
          mkdir -p release
          npm pack --ignore-scripts --pack-destination release
          archive="$(find release -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          if [[ -z "${archive}" ]]; then
            echo "npm pack did not produce a tarball." >&2
            exit 1
          fi
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${ARCHIVE}" --clobber
            exit 0
          fi

          args=(
            release create "${GITHUB_REF_NAME}" "${ARCHIVE}"
            --verify-tag
            --generate-notes
            --title "dsh-photon-imessage ${VERSION}"
          )
          if [[ "${PRERELEASE}" == "true" ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh "${args[@]}"
